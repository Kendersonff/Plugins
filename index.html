<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE SEGURIDAD - NIVEL 5</title>
    <style>
        body { background-color: black; margin: 0; overflow: hidden; font-family: 'Courier New', monospace; cursor: pointer; }
        canvas { position: absolute; top: 0; left: 0; z-index: 1; }
        #overlay {
            position: relative; z-index: 2;
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.7); color: #0f0;
        }
        #terminal { width: 80%; font-size: 1.1rem; text-shadow: 0 0 8px #0f0; }
        #rick { display: none; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 3; border: none; }
        .blink { animation: blinker 1s linear infinite; color: white; font-size: 1.5rem; text-align: center; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div id="overlay">
        <div id="terminal">
            <p class="blink"> [ ACCESO RESTRINGIDO ] <br> TOQUE LA PANTALLA PARA DECRIPTAR </p>
        </div>
    </div>
    
    <iframe id="rick" src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&controls=0&mute=0" allow="autoplay; encrypted-media"></iframe>

    <script>
        // --- EFECTO MATRIX ---
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0f0";
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // --- LÓGICA DE LA BROMA ---
        const texto = [
            "> Localizando servidor de 'SistemaPedidos'...",
            "> Forzando entrada en puerto 8080...",
            "> ¡Vulnerabilidad encontrada en el Kernel!",
            "> Inyectando payload de compañero intelectual...",
            "> Extrayendo contraseñas de administrador...",
            "> Borrando rastros de intrusión...",
            "> SISTEMA COMPROMETIDO EXITOSAMENTE.",
            "> Iniciando ejecución de RICKROLL.SH..."
        ];

        let i = 0;
        let iniciado = false;
        const terminal = document.getElementById('terminal');

        document.body.onclick = function() {
            if (!iniciado) {
                iniciado = true;
                terminal.innerHTML = "";
                escribir();
            }
        };

        function escribir() {
            if (i < texto.length) {
                terminal.innerHTML += texto[i] + "<br>";
                i++;
                setTimeout(escribir, 700);
            } else {
                setTimeout(() => {
                    document.getElementById('rick').style.display = 'block';
                }, 1000);
            }
        }
    </script>
</body>
</html>
